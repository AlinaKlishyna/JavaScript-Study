<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Learn JavaScript</title>
</head>

<body>
    <noscript>On JavaScript</noscript>

    <script>
        // Comment

        /*
            Comments
        */
        // document.write("JavaScript say Hello!");

        console.log("JavaScript say Hello!");
        console.log("%cHello world!", "color: green; font-size: 40px");
        console.log("Hello " + "there, " + "World");
        console.log("Hello", "there,", "World")

        /* Arithmetic operators in JS:
            + addition subtraction
            * multiplication
            / division
        */

        /* Comparison operators in JS:
            › greater than
            ‹ less than == equal
        */

        console.log(2 + 2);
        console.log(1 + 2 + 3 + 4 + 5);
        console.log(20 - 18);
        console.log(2 * 3);
        console.log(8 / 1);
        console.log(3 > 2);
        console.log(2 > 3);
        console.log(10 == 10);

    </script>

</body>

</html>
